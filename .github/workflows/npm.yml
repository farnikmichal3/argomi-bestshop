name: JavaScript

on:
  push:
    branches:
      - main
    paths:
      - 'assets/**'
      - 'package.json'
      - 'package-lock.json'
      - '.nvmrc'
      - '.github/workflows/npm.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'assets/**'
      - 'package.json'
      - 'package-lock.json'
      - '.nvmrc'
      - '.github/workflows/npm.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: JavaScript quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Verify Node.js and npm versions
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build CSS and JavaScript
        run: npm run build

      - name: Audit npm dependencies
        run: npm audit
