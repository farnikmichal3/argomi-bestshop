name: Composer

on:
  push:
    branches:
      - main
    paths:
      - '**.php'
      - 'app/**'
      - 'tests/**'
      - 'composer.json'
      - 'composer.lock'
      - 'phpstan.neon'
      - 'deptrac.yaml'
      - '.php-cs-fixer.dist.php'
      - '.github/workflows/composer.yml'
  pull_request:
    branches:
      - main
    paths:
      - '**.php'
      - 'app/**'
      - 'tests/**'
      - 'composer.json'
      - 'composer.lock'
      - 'phpstan.neon'
      - 'deptrac.yaml'
      - '.php-cs-fixer.dist.php'
      - '.github/workflows/composer.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: composer-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: PHP quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none

      - name: Validate Composer configuration
        run: composer validate --no-check-publish

      - name: Install dependencies
        uses: ramsey/composer-install@v4
        with:
          composer-options: '--prefer-dist --no-interaction --no-progress'

      - name: Audit Composer dependencies
        run: composer audit

      - name: Run PHPStan
        run: composer phpstan

      - name: Check coding standard
        run: composer cs

      - name: Check architecture
        run: composer arch
