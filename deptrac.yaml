deptrac:
  paths:
    - app/

  exclude_files:
    - '#(^|/)Tests?(/|$)#'
    - '#(^|/)Resources(/|$)#'

  analyser:
    types:
      - class

  layers:
    - name: Bootstrap
      collectors:
        - type: classLike
          value: '^App\\Bootstrap$'

    - name: Core
      collectors:
        - type: classLike
          value: '^App\\Core\\'

    - name: Presentation
      collectors:
        - type: classLike
          value: '^App\\Presentation\\'

    - name: Shared
      collectors:
        - type: classLike
          value: '^App\\Shared\\'

    - name: UI
      collectors:
        - type: classLike
          value: '^App\\UI\\'

    - name: External
      collectors:
        - type: classLike
          value: '^(?!App\\)'

    - name: CartApi
      collectors:
        - type: classLike
          value: '^App\\Modules\\Cart\\Api\\'
    - name: CartInternal
      collectors:
        - type: classLike
          value: '^App\\Modules\\Cart\\(?!Api\\)'

    - name: CatalogApi
      collectors:
        - type: classLike
          value: '^App\\Modules\\Catalog\\Api\\'
    - name: CatalogInternal
      collectors:
        - type: classLike
          value: '^App\\Modules\\Catalog\\(?!Api\\)'

    - name: CheckoutApi
      collectors:
        - type: classLike
          value: '^App\\Modules\\Checkout\\Api\\'
    - name: CheckoutInternal
      collectors:
        - type: classLike
          value: '^App\\Modules\\Checkout\\(?!Api\\)'

    - name: CustomerApi
      collectors:
        - type: classLike
          value: '^App\\Modules\\Customer\\Api\\'
    - name: CustomerInternal
      collectors:
        - type: classLike
          value: '^App\\Modules\\Customer\\(?!Api\\)'

    - name: IdentityApi
      collectors:
        - type: classLike
          value: '^App\\Modules\\Identity\\Api\\'
    - name: IdentityInternal
      collectors:
        - type: classLike
          value: '^App\\Modules\\Identity\\(?!Api\\)'

    - name: InventoryApi
      collectors:
        - type: classLike
          value: '^App\\Modules\\Inventory\\Api\\'
    - name: InventoryInternal
      collectors:
        - type: classLike
          value: '^App\\Modules\\Inventory\\(?!Api\\)'

    - name: MailingApi
      collectors:
        - type: classLike
          value: '^App\\Modules\\Mailing\\Api\\'
    - name: MailingInternal
      collectors:
        - type: classLike
          value: '^App\\Modules\\Mailing\\(?!Api\\)'

    - name: OrdersApi
      collectors:
        - type: classLike
          value: '^App\\Modules\\Orders\\Api\\'
    - name: OrdersInternal
      collectors:
        - type: classLike
          value: '^App\\Modules\\Orders\\(?!Api\\)'

    - name: PaymentsApi
      collectors:
        - type: classLike
          value: '^App\\Modules\\Payments\\Api\\'
    - name: PaymentsInternal
      collectors:
        - type: classLike
          value: '^App\\Modules\\Payments\\(?!Api\\)'

    - name: PricingApi
      collectors:
        - type: classLike
          value: '^App\\Modules\\Pricing\\Api\\'
    - name: PricingInternal
      collectors:
        - type: classLike
          value: '^App\\Modules\\Pricing\\(?!Api\\)'

    - name: SettingsApi
      collectors:
        - type: classLike
          value: '^App\\Modules\\Settings\\Api\\'
    - name: SettingsInternal
      collectors:
        - type: classLike
          value: '^App\\Modules\\Settings\\(?!Api\\)'

    - name: ShippingApi
      collectors:
        - type: classLike
          value: '^App\\Modules\\Shipping\\Api\\'
    - name: ShippingInternal
      collectors:
        - type: classLike
          value: '^App\\Modules\\Shipping\\(?!Api\\)'

    - name: TaxApi
      collectors:
        - type: classLike
          value: '^App\\Modules\\Tax\\Api\\'
    - name: TaxInternal
      collectors:
        - type: classLike
          value: '^App\\Modules\\Tax\\(?!Api\\)'

    - name: TranslationApi
      collectors:
        - type: classLike
          value: '^App\\Modules\\Translation\\Api\\'
    - name: TranslationInternal
      collectors:
        - type: classLike
          value: '^App\\Modules\\Translation\\(?!Api\\)'

  
  
  ruleset:
    # Composition root – smí skládat aplikační vrstvy a moduly.
    Bootstrap:
      - Core
      - Presentation
      - Shared
      - UI
      - External
      - CartApi
      - CatalogApi
      - CheckoutApi
      - CustomerApi
      - IdentityApi
      - InventoryApi
      - MailingApi
      - OrdersApi
      - PaymentsApi
      - PricingApi
      - SettingsApi
      - ShippingApi
      - TaxApi
      - TranslationApi

    # Technické jádro nesmí znát doménové moduly.
    Core:
      - Shared
      - External

    # Centrální prezentační infrastruktura.
    Presentation:
      - Core
      - Shared
      - External

    # Sdílený kód nesmí záviset na aplikačních vrstvách.
    Shared:
      - External

    # Uživatelské rozhraní komunikuje s moduly přes jejich API.
    UI:
      - Presentation
      - Shared
      - External
      - CartApi
      - CatalogApi
      - CheckoutApi
      - CustomerApi
      - IdentityApi
      - InventoryApi
      - MailingApi
      - OrdersApi
      - PaymentsApi
      - PricingApi
      - SettingsApi
      - ShippingApi
      - TaxApi
      - TranslationApi

    # Veřejná API mohou používat vlastní interní implementaci.
    CartApi: [CartInternal, Shared, External]
    CatalogApi: [CatalogInternal, Shared, External]
    CheckoutApi: [CheckoutInternal, Shared, External]
    CustomerApi: [CustomerInternal, Shared, External]
    IdentityApi: [IdentityInternal, Shared, External]
    InventoryApi: [InventoryInternal, Shared, External]
    MailingApi: [MailingInternal, Shared, External]
    OrdersApi: [OrdersInternal, Shared, External]
    PaymentsApi: [PaymentsInternal, Shared, External]
    PricingApi: [PricingInternal, Shared, External]
    SettingsApi: [SettingsInternal, Shared, External]
    ShippingApi: [ShippingInternal, Shared, External]
    TaxApi: [TaxInternal, Shared, External]
    TranslationApi: [TranslationInternal, Shared, External]

    # Interní implementace mají přístup pouze ke Shared
    # a externím knihovnám. Ostatní moduly musí používat
    # výslovně povolené veřejné API.
    CartInternal: [Shared, External]
    CatalogInternal: [Shared, External]
    CheckoutInternal: [Shared, External]
    CustomerInternal: [Shared, External]
    IdentityInternal: [Shared, External]
    InventoryInternal: [Shared, External]
    MailingInternal: [Shared, External]
    OrdersInternal: [Shared, External]
    PaymentsInternal: [Shared, External]
    PricingInternal: [Shared, External]
    SettingsInternal: [Shared, External]
    ShippingInternal: [Shared, External]
    TaxInternal: [Shared, External]
    TranslationInternal: [Shared, External]
